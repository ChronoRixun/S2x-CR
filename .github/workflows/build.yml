name: Build

on:
  push:
    branches:
      - integration
  pull_request:
    branches:
      - integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release binaries
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 build/s2x.sln

      # The offline harnesses compile the production economy and script-storage
      # code against stubs; they need no game, token or network.
      - name: Build the economy harness
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 tests/economy/zombies.vcxproj

      - name: Run the economy harness
        run: build/tests/zombies/bin/zombies.exe

      - name: Build the script storage harness
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 tests/scripting/storage.vcxproj

      - name: Run the script storage harness
        run: build/tests/scripting/bin/storage.exe

      - name: Upload Release binary
        uses: actions/upload-artifact@v7
        with:
          name: Release binary
          path: build/bin/x64/Release/s2x.exe
          if-no-files-found: error

      - name: Upload Release symbols
        uses: actions/upload-artifact@v7
        with:
          name: Release symbols
          path: build/bin/x64/Release/s2x.pdb
          if-no-files-found: error
